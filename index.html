 50%","Launches & offers 33%","Culture 17%"],driver:"Founder-as-formulator. Low reach, high trust: 1.47% founder ER on 5.8K-play reels."},{name:"Moxie Beauty",posts:43,formats:{Reel:79,Carousel:21,Static:0},mix:{Brand:83,Creator:10,Founder:7},themes:["Offers / sales 50%","Launches 25%","Education 15%"],driver:"Sale-driven brand voice. Founder appearances rare (3 posts in 4 months)."}],v=[{p:"Q4 '24",fmc:18,mox:9,lead:2},{p:"H1 '25",fmc:22,mox:11,lead:2.1},{p:"H2 '25",fmc:33,mox:18,lead:1.9},{p:"Q1 '26",fmc:41,mox:27,lead:1.5},{p:"Q2 '26",fmc:50,mox:38,lead:1.3},{p:"Q3 '26",fmc:50,mox:32,lead:1.6}],ue=[{id:"maggi",icon:W,name:"The Maggie-Hair Chapters",tagline:"Anshita's origin story, told in school classrooms",mechanism:"Anshita goes back to the schools and colleges that mirror where it started: a 16-year-old called the 'Maggie-haired girl'. On camera she sits with teen girls, hears their hair stories, and does a live product application on one of them. The arc of each episode is one girl's before, Anshita's own memory of the same moment, and the after.",why:["Her '16-year-old Anshita wanted to go to prom and stop being called Maggi' reel (Apr 8) pulled 60.9K plays at 2.03% ER \u2014 2.01\xD7 brand reel median. The origin story is the strongest proven founder cell.","ind\u0113 wild's mother-daughter champi reels work on the same instinct: a generational memory anchored to a product moment. The schoolgirl frame extends it one generation back."],complexity:2,specs:{Length:"60\u201390s reel + 10-slide carousel",Cadence:"1 per month",Format:"Reel + Carousel"}},{id:"audit",icon:R,name:"Routine Audits \xD7 Champion Buyers",tagline:"Anshita meets the real repeat buyers behind the LTV",mechanism:"Two concepts under one series. (A) Office vanity: a Loyalty Circle member comes to the FMC office; Anshita walks through her routine, what she used before FMC, what still goes wrong, and co-builds the next step. (B) Hand-delivered surprises: Anshita shows up at a long-term buyer's door with a new product, a thank-you note and a small giveaway kit. Both unscripted, phone-shot, captions on screen.",why:["The Discovery Kit launch reel (Jun 18, Anshita \xD7 a buyer problem) pulled 234K plays and 1,442 comments \u2014 the viral founder format of the window.","A champion buyer's history on Shopify is the one creator a competitor cannot book. Each delivery is a story the buyer herself re-posts: free second impressions."],complexity:1,specs:{Length:"45\u201375s + 15s cut-downs",Cadence:"2 per month (1 of each concept)",Format:"Reel"}},{id:"convention",icon:A,name:"Curl Conventions \xD7 Micro-Biz Meetups",tagline:"Anshita gathers small-business owners in haircare \u2014 they repost the brand for her",mechanism:"A standing monthly meetup in one city for small-business owners in the haircare adjacency: hairstylists, salon owners, curl coaches, indie product makers, boutique owners. FMC supplies the room, the giveaways and the Loyalty Circle onboarding. Each attendee leaves with a sampler kit \u2014 and posts it, because it's content for their own channel too. The founder, not a marketer, hosts.",why:["Nish Hair (Parul Gulati) scaled the same loop: founder shows up at small-biz events in Guwahati and Mumbai, hands over products, each attendee seeds the brand into their own audience. One meetup = 10\u201340 free second posts.","FMC's Curl Convention already exists as a brand asset (Oct 7 carousel teasing the next one). Micro-biz meetups add a repeatable, lower-production cadence between the big events."],complexity:2,specs:{Length:"1 reel + highlight carousel per meetup",Cadence:"1 meetup per month",Format:"Reel + Carousel"}}],je=[{id:"proof",icon:L,name:"Product Proof",status:"crowded",who:"FMC's longest-running ads are product and demo ads (up to 167 days). Moxie and Manetain run them too."},{id:"social",icon:A,name:"Social Proof",status:"crowded",who:"Person-led creator ads make up 63% of Moxie's top ads, 33% of Manetain's and 27% of FMC's."},{id:"offer",icon:N,name:"Offer & Price",status:"crowded",who:"Birthday sales, BOGO, free gifts and the \u20B9349 trial kit. Every brand runs a version."},{id:"agitate",icon:V,name:"Problem\u2013Agitate",status:"used",who:"'Thought your hair was frizzy? You probably have curly hair' (Moxie). 'If your washday hasn't been giving lately\u2026' (Manetain)."},{id:"compare",icon:K,name:"Comparison",status:"used",who:"Rare, mostly 'soft hold vs strong hold' product comparisons."},{id:"founder",icon:y,name:"Founder-Led Curl Education",status:"open",who:"ind\u0113 wild has acquired the broader beauty category with Diipa's personal brand (388K avg plays), but her content isn't curl-specific. Manetain goes deep on CGM teaching but at 5.8K plays, no volume. Nish Hair (Parul Gulati) built a 1M+ brand by making the founder's own hair the proof. No curl brand has done this in India yet \u2014 this is FMC's open lane."}],ha=[{id:"search",icon:Q,title:"Branded search volume",line:"Rises as founder trust builds direct recall, ahead of generic category searches.",baseline:"Google Trends index ~50 (Q3 2026, India, 4-brand basket). Up ~2.8\xD7 in two years.",measure:"Weekly branded-search index, read against each series drop.",signal:"A sustained step-up after each drop, like the ~20 \u2192 ~40 jump after the May 2025 founder series."},{id:"repeat",icon:X,title:"Repeat purchase rate",line:"Gets stronger as community validation and Loyalty Circle participation grow.",baseline:"Internal only. Pull Shopify repeat-purchase cohorts on day one.",measure:"60/90-day repeat rate for buyers who watched the series vs those who didn't, plus Loyalty Circle sign-ups.",signal:"Exposed cohorts repeat faster than unexposed cohorts."},{id:"dependency",icon:$,title:"Less dependence on creator collabs",line:"Shifts monthly budget away from short-term influencer seeding.",baseline:"FMC founder cadence swung 10% \u2192 27% \u2192 4% \u2192 0% from Jun to Oct. ind\u0113 wild held 11\u201331% every month.",measure:"Share of monthly posts that are founder-led, rolling 30-day.",signal:"FMC founder-led share holds between 18\u201325% every month, no post-birthday collapse."},{id:"selective",icon:_,title:"Fewer, bigger creator spikes",line:"Fewer creator partnerships, used only as launch spikes, not everyday survival.",baseline:"Creators currently run as an always-on baseline.",measure:"CPA of Partnership Ads during launches vs always-on seeding.",signal:"Equal or better launch CPA with fewer, larger creator bursts."}],Ia=a=>a>=1e3?`${Math.round(a/1e3)}K`:`${a}`,ga="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAhgAAACDCAYAAADPumK5AAAApmVYSWZJSSoACAAAAAYAEgEDAAEAAAABAAAAGgEFAAEAAABWAAAAGwEFAAEAAABeAAAAKAEDAAEAAAACAAAAPAECAAkAAABmAAAAaYcEAAEAAABwAAAAAAAAAAplBADoAwAACmUEAOgDAABpbWFnZXJ5NAAABAAAkAcABAAAADAyMTABoAMAAQAAAP//AAACoAQAAQAAABgCAAADoAQAAQAAAIMAAAAAAAAATf/5KAAAAQtpQ0NQaWNjAAB4nGNgYFyRk5xbzCTAwJCbV1IU5O6kEBEZpcB+h4GRQZKBmUGTwTIxubjAMSDAhwEn+HaNgRFEX9YFmcVAGuBMSS1OZmBg+MDAwBCfXFBUwsDACLKLp7ykAMSOYGBgECmKiIxiYGDMAbHTIewGEDsJwp4CVhMS5MzAwMjDwMDgkI7ETkJiQ+0CAdZko+RMZIcklxaVQZlSDAwMpxlPMiezTuLI5v4mYC8aKG2i+FFzgpGE9SQ31sDy2LfZBVWsnRtn1azJ3F97+fBLg///S1IrSkCanZ0NGEBhiB42CLH8RQwMFl8ZGJgnIMSSZjIwbG9lYJC4hRBTWcDAwN/CwLDtPADw/U3bQyU8RgAAAAlwSFlzAAAsSwAALEsBpT2WqQAAHqFJREFUeNrtneF1Ez3ThsV33v8sFbBUwD4VxFRAqACngpgK7FSQUIFDBUkqsKkgpoIsFXipgO8H2rAx9q7u0YxW0s51Ts7zvkBsrXYk3ZoZjV4ZRVEURRmPwhhTGWPeG2NK+1PZvysP/m1tjGnsz84Y893+2U67UVEURVGmTWGMmRljro0xG2PMb4afJ2PM2n6uoiiKoigToRUVa2PMnklU9ImNz9rliqIoipIvradCWlSo0FAURVGUCXDOGP7w/dkcyeVQFEVRFCURCmPMaiRvxdDP3hiz0FekKIqiKOkQs7A4/LnW16UoiqIo8TO3uQ6xC4vDkEmhr05RFEVR4mMWUY4F5edRRYaiKIqixENhj5qmKixUZCiKoihKZCwSybNAwyWKoiiKooxAmXg4RBM/R+KVdoGiKIpygoUxZhkolNAYY7b2XpHaGPPDeky6lJ2qoLPOnSW+zI0x3/R1K4qiKIoshTHmLlCI4tIY85bYzpIpJ2SvxbgURVEURZaZ8NHTVlRwekVKBkGk+RiKoiiKIsRCUFisjTFnwu1ferZRq30qiqIoCiOFMeZWqET3MvBx0JnHaZe9Hl1VFEVRFB5KWxOCW1wsR1ysKw+RsVSTUBRFURQ/KoF8i1huL52pF0NRFEVRwjNnLpz1FCDHAoWaU3Kp5qEoiqIoOCuBPItY2eiJknHQQluKonBRdgohFbZYkrH/rbV7omHFKAh2xphPkb/fknjvyAdb :root{
  --fmc-floral:#fefcec; --fmc-smoke:#f7f5ef; --fmc-blush:#fff3f7;
  --fmc-pink:#f095b9;   --fmc-deep:#ff4081;  --fmc-sky:#c7e3ff;
  --fmc-ink:#1a1a1a;    --fmc-charcoal:#414651;
}
html{scroll-behavior:smooth}

/* surfaces */
.bg-white{background-color:var(--fmc-floral)!important}
.bg-white\\/80,.bg-white\\/85{background-color:rgb(254 252 236/.88)!important}
.bg-pink-50,.bg-pink-50\\/60,.bg-pink-100{background-color:var(--fmc-blush)!important}
.bg-neutral-100,.bg-neutral-200{background-color:var(--fmc-smoke)!important}
.bg-violet-50,.bg-violet-100,.bg-yellow-50,.bg-yellow-100{background-color:var(--fmc-sky)!important}

/* accents */
.bg-pink-500,.bg-pink-600{background-color:var(--fmc-deep)!important}
.bg-pink-300,.bg-violet-500{background-color:var(--fmc-pink)!important}
.bg-yellow-300,.bg-violet-400,.bg-neutral-300{background-color:var(--fmc-sky)!important}
.bg-yellow-400,.bg-neutral-800{background-color:var(--fmc-charcoal)!important}
.bg-neutral-900{background-color:var(--fmc-ink)!important}

/* text */
.text-neutral-900,.text-neutral-800{color:var(--fmc-ink)!important}
.text-neutral-700,.text-neutral-600,.text-neutral-500,.text-neutral-400{color:var(--fmc-charcoal)!important}
.text-neutral-300,.text-neutral-200,.text-neutral-100,.text-white{color:var(--fmc-floral)!important}
.text-pink-600,.text-pink-700,.text-violet-600,.text-violet-700{color:var(--fmc-deep)!important}
.text-yellow-300{color:var(--fmc-sky)!important}

/* borders */
.border-neutral-100,.border-neutral-200{border-color:rgb(240 149 185/.35)!important}
.border-pink-100,.border-pink-200,.border-pink-300{border-color:var(--fmc-pink)!important}
.border-pink-400,.border-pink-500{border-color:var(--fmc-deep)!important}
.border-violet-200,.border-yellow-300{border-color:var(--fmc-sky)!important}
.border-neutral-900{border-color:var(--fmc-ink)!important}

/* hover + group-hover states */
.hover\\:bg-pink-50:hover{background-color:var(--fmc-blush)!important}
.hover\\:bg-pink-300:hover{background-color:var(--fmc-pink)!important}
.hover\\:bg-pink-600:hover{background-color:var(--fmc-deep)!important}
.hover\\:bg-yellow-300:hover,.group:hover .group-hover\\:bg-yellow-300{background-color:var(--fmc-sky)!important}
.hover\\:text-pink-600:hover,.hover\\:text-pink-700:hover,.group:hover .group-hover\\:text-pink-600{color:var(--fmc-deep)!important}
.group:hover .group-hover\\:text-neutral-900{color:var(--fmc-ink)!important}
.hover\\:border-pink-300:hover{border-color:var(--fmc-pink)!important}
.hover\\:border-pink-400:hover,.hover\\:border-pink-500:hover{border-color:var(--fmc-deep)!important}
.hover\\:border-neutral-900:hover{border-color:var(--fmc-ink)!important}

/* gradient stops (reel mock + pillar card) */
.from-pink-100,.from-pink-200{--tw-gradient-from:var(--fmc-blush)!important;--tw-gradient-to:rgb(255 243 247/0)!important;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)!important}
.via-violet-50,.via-violet-200{--tw-gradient-to:rgb(199 227 255/0)!important;--tw-gradient-stops:var(--tw-gradient-from),var(--fmc-sky),var(--tw-gradient-to)!important}
.to-yellow-50,.to-yellow-100{--tw-gradient-to:var(--fmc-floral)!important}

/* typefaces */
.font-sans{font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif!important}
.fmc-logo{font-family:'Anton','Oswald',Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif!important}

/* logo wordmark \u2014 uses the real FMC mark */
.fmc-logo-img{height:1em;width:auto;object-fit:contain;vertical-align:middle}
.fmc-logo-img.text-5xl{height:0.9em}
.fmc-logo-img.text-6xl{height:0.9em}
.fmc-logo-img.text-7xl{height:0.9em}

/* hero emoji loop: bottle squeezes -> cream drop -> curl springs -> sparkle */
@keyframes fmcSqueeze{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-30deg) scale(1,.84)}38%{transform:rotate(-30deg) scale(1)}55%{transform:rotate(0) scale(1)}}
@keyframes fmcDrop{0%,18%{opacity:0;transform:translate(0,0) scale(.4)}26%{opacity:1}40%{opacity:1;transform:translate(46px,10px) scale(1)}48%,100%{opacity:0;transform:translate(52px,12px) scale(.5)}}
@keyframes fmcCurl{0%,40%{transform:translateY(0) rotate(0) scale(1)}52%{transform:translateY(-12px) rotate(-14deg) scale(1.18)}66%,100%{transform:translateY(0) rotate(0) scale(1)}}
@keyframes fmcSpark{0%,50%{opacity:0;transform:scale(.3) rotate(0)}62%{opacity:1;transform:scale(1.25) rotate(25deg)}80%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(.6)}}
.fmc-bottle{display:inline-block;transform-origin:70% 90%;animation:fmcSqueeze 2.6s ease-in-out infinite}
.fmc-drop{position:absolute;left:30px;top:6px;width:12px;height:12px;border-radius:9999px;background:var(--fmc-floral);box-shadow:0 0 0 2px var(--fmc-pink);animation:fmcDrop 2.6s ease-in-out infinite}
.fmc-curl{display:inline-block;animation:fmcCurl 2.6s ease-in-out infinite}
.fmc-spark{display:inline-block;animation:fmcSpark 2.6s ease-in-out infinite}

/* scroll reveal */
@keyframes fmcRise{from{transform:translateY(14px)}to{transform:none}}
.fmc-reveal.is-in>div{animation:fmcRise .6s cubic-bezier(.2,.7,.2,1) both}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .fmc-bottle,.fmc-curl,.fmc-spark,.fmc-drop{animation:none!important}
  .fmc-drop{display:none}
